<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>body{width:860px}</style></head><body>
<script>
const W=820,H=380,L=60,R=20,T=20,B=50;const x0=320,x1=1600,y0=30,y1=72;
const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(v-y0)/(y1-y0)*(H-T-B);
let s=`<svg width="${W}" height="${H}" font-family="Geist" font-size="12">`;
for(let v=400;v<=1600;v+=200)s+=`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${H-B}" stroke="#F3F4F6"/><text x="${X(v)}" y="${H-B+18}" text-anchor="middle" fill="#6B7280">${v}</text>`;
for(let v=40;v<=70;v+=10)s+=`<line x1="${L}" y1="${Y(v)}" x2="${W-R}" y2="${Y(v)}" stroke="#F3F4F6"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" fill="#6B7280">${v}px</text>`;
s+=`<text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" fill="#374151" font-weight="600">Ancho de la ventana (px)</text>`;
// preferido sin límites
s+=`<line x1="${X(x0)}" y1="${Y(24+0.04*x0)}" x2="${X(1200)}" y2="${Y(24+0.04*1200)}" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 5"/>`;
// media query de dos tamaños
s+=`<polyline points="${X(x0)},${Y(40)} ${X(600)},${Y(40)} ${X(600)},${Y(64)} ${X(x1)},${Y(64)}" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="2 4"/>`;
// clamp
s+=`<polyline points="${X(x0)},${Y(40)} ${X(400)},${Y(40)} ${X(1000)},${Y(64)} ${X(x1)},${Y(64)}" fill="none" stroke="#06B6C4" stroke-width="4" stroke-linejoin="round"/>`;
s+=`<text x="${X(330)}" y="${Y(40)+20}" fill="#0E7490" font-weight="600">mínimo</text><text x="${X(1560)}" y="${Y(64)+20}" text-anchor="end" fill="#0E7490" font-weight="600">máximo</text>`;
for(const [v,f,t,dx,dy,an] of [[390,40,'celular · 40px',10,-12,'start'],[820,56.8,'tablet · 56.8px',12,18,'start'],[1440,64,'escritorio · 64px',0,-14,'middle']]){s+=`<circle cx="${X(v)}" cy="${Y(f)}" r="6" fill="#fff" stroke="#0E7490" stroke-width="3"/><text x="${X(v)+dx}" y="${Y(f)+dy}" text-anchor="${an}" fill="#0B0F19" font-weight="600">${t}</text>`;}
// leyenda
const lg=[['#06B6C4','',4,'clamp(2.5rem, 1.5rem + 4vw, 4rem)'],['#F59E0B','2 4',2.5,'media query de 600px: salta de 40 a 64'],['#9CA3AF','6 5',2,'1.5rem + 4vw, sin mínimo ni máximo']];
lg.forEach(([c,d,w,t],i)=>{const y=T+14+i*20;s+=`<line x1="${L+12}" y1="${y}" x2="${L+44}" y2="${y}" stroke="${c}" stroke-width="${w}" ${d?`stroke-dasharray="${d}"`:''}/><text x="${L+52}" y="${y+4}" fill="#374151">${t}</text>`;});
document.body.innerHTML=s+'</svg>';
</script></body></html>
