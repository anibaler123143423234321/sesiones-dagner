<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:900px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{border:1px solid #E5E7EB;border-radius:12px;padding:12px;}
.st{position:relative;height:150px;background:#F9FAFB;border-radius:8px;margin-top:6px}
.o,.b{position:absolute;left:50%;top:50%;width:84px;height:56px;margin:-28px 0 0 -42px;border-radius:8px}
.o{border:2px dashed #9CA3AF}
.b{background:#06B6C4;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;opacity:.92}
.c p{font-size:12px;color:#5F676C;margin-top:8px}
</style></head><body>
<div class="c"><div class="lbl">translate(24px, -16px)</div><div class="st"><div class="o"></div><div class="b" style="transform:translate(24px,-16px)">mover</div></div><p>Se desplaza. Sus vecinos no se mueven.</p></div>
<div class="c"><div class="lbl">scale(1.3)</div><div class="st"><div class="o"></div><div class="b" style="transform:scale(1.3)">escalar</div></div><p>Crece desde su centro: 1 es el tamaño normal.</p></div>
<div class="c"><div class="lbl">rotate(-12deg)</div><div class="st"><div class="o"></div><div class="b" style="transform:rotate(-12deg)">girar</div></div><p>Gira en grados; negativo, al revés del reloj.</p></div>
<div class="c"><div class="lbl">skewX(-14deg)</div><div class="st"><div class="o"></div><div class="b" style="transform:skewX(-14deg)">inclinar</div></div><p>Inclina la caja hacia un lado.</p></div>
</body></html>
