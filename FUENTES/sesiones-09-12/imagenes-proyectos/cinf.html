<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:628px;height:220px;overflow:hidden;font-family:Geist,sans-serif;background:#F9FAFB;display:flex}
.side{width:150px;background:#0B0F19;color:#fff;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.logo{font-family:Outfit;font-weight:800;font-size:15px;margin-bottom:8px}.logo b{color:#06B6C4}
.it{height:22px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:10px;color:#9CA3AF}
.it.on{background:rgba(6,182,196,.18);color:#fff}
.it i{width:8px;height:8px;border-radius:2px;background:currentColor;opacity:.8}
.main{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center}
.top h1{font-family:Outfit;font-size:14px;color:#0B0F19}
.search{width:150px;height:22px;border:1px solid #E5E7EB;border-radius:6px;background:#fff}
.av{width:22px;height:22px;border-radius:50%;background:#06B6C4}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.card small{font-size:9px;color:#374151;font-weight:600}
.bar{height:7px;border-radius:4px;background:#E5E7EB}.bar.c{background:#06B6C4}
.row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;flex:1}
.chart{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px;display:flex;align-items:flex-end;gap:8px}
.chart span{flex:1;background:#06B6C4;border-radius:3px 3px 0 0;opacity:.85}
.list{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:7px}
.li{display:flex;gap:6px;align-items:center}.li i{width:14px;height:14px;border-radius:4px;background:#E5E7EB}.li .bar{flex:1}
</style></head><body>
<aside class="side"><div class="logo">CINF <b>USS</b></div>
<div class="it on"><i></i>Inicio</div><div class="it"><i></i>Cursos</div><div class="it"><i></i>Estudiantes</div><div class="it"><i></i>Proyectos</div><div class="it"><i></i>Reportes</div></aside>
<div class="main"><div class="top"><h1>Ecosistema CINF USS</h1><div style="display:flex;gap:8px;align-items:center"><div class="search"></div><div class="av"></div></div></div>
<div class="cards"><div class="card"><small>Cursos</small><div class="bar c" style="width:70%"></div><div class="bar" style="width:45%"></div></div>
<div class="card"><small>Estudiantes</small><div class="bar c" style="width:85%"></div><div class="bar" style="width:55%"></div></div>
<div class="card"><small>Proyectos</small><div class="bar c" style="width:60%"></div><div class="bar" style="width:40%"></div></div></div>
<div class="row"><div class="chart"><span style="height:40%"></span><span style="height:65%"></span><span style="height:50%"></span><span style="height:80%"></span><span style="height:60%"></span><span style="height:90%"></span><span style="height:72%"></span></div>
<div class="list"><div class="li"><i></i><div class="bar"></div></div><div class="li"><i></i><div class="bar" style="max-width:70%"></div></div><div class="li"><i></i><div class="bar" style="max-width:85%"></div></div><div class="li"><i></i><div class="bar" style="max-width:60%"></div></div></div></div>
</div></body></html>
