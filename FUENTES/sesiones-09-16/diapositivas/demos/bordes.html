<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 16px;width:800px}
.b{height:96px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Geist Mono';font-size:12px;color:#374151;text-align:center;padding:6px}
</style></head><body>
<div><div class="lbl">solid</div><div class="b" style="border:2px solid #374151">2px solid</div></div>
<div><div class="lbl">dashed</div><div class="b" style="border:2px dashed #06B6C4">2px dashed</div></div>
<div><div class="lbl">dotted</div><div class="b" style="border:3px dotted #9CA3AF">3px dotted</div></div>
<div><div class="lbl">border-bottom</div><div class="b" style="border-bottom:2px solid #06B6C4;background:#F9FAFB">solo abajo</div></div>
<div><div class="lbl">radius: 0</div><div class="b" style="border:1px solid #E5E7EB">0</div></div>
<div><div class="lbl">radius: 8px</div><div class="b" style="border:1px solid #E5E7EB;border-radius:8px">8px · botón</div></div>
<div><div class="lbl">radius: 12px</div><div class="b" style="border:1px solid #E5E7EB;border-radius:12px">12px · tarjeta</div></div>
<div><div class="lbl">radius: 50%</div><div class="b" style="border:3px solid #06B6C4;border-radius:50%;width:96px;margin:0 auto">círculo</div></div>
</body></html>
