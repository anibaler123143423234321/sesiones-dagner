<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:900px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.c{border:1px solid #E5E7EB;border-radius:12px;padding:12px 14px}
.c .lbl{margin-bottom:2px}.c p{font-size:12.5px;color:#5F676C;margin-bottom:6px}
.c.hoy{border:2px solid #06B6C4;background:#F1FBFC}
svg{display:block}
</style></head><body>
<script>
const C=[['linear','0, 0, 1, 1','La misma velocidad todo el tiempo'],['ease','0.25, 0.1, 0.25, 1','El valor por defecto'],['ease-in','0.42, 0, 1, 1','Arranca lento, termina rápido'],['ease-out','0, 0, 0.58, 1','Arranca rápido, frena al llegar'],['ease-in-out','0.42, 0, 0.58, 1','Lento al principio y al final'],['var(--ease-out)','0.22, 1, 0.36, 1','Tu portafolio: una salida suave marcada']];
for(const [n,v,t] of C){const [a,b,c,d]=v.split(',').map(Number);const W=240,H=120,P=10;const X=x=>P+x*(W-2*P),Y=y=>H-P-y*(H-2*P);
const g=`<svg width="${W}" height="${H}"><rect x="${P}" y="${P}" width="${W-2*P}" height="${H-2*P}" fill="#F9FAFB" stroke="#E5E7EB"/>`+
`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" stroke="#D1D5DB" stroke-dasharray="4 4"/>`+
`<path d="M${X(0)},${Y(0)} C${X(a)},${Y(b)} ${X(c)},${Y(d)} ${X(1)},${Y(1)}" fill="none" stroke="#06B6C4" stroke-width="3.5" stroke-linecap="round"/>`+
`<text x="${W-P-4}" y="${H-P-4}" text-anchor="end" font-size="10" fill="#9CA3AF" font-family="Geist">tiempo →</text><text x="${P+4}" y="${P+12}" font-size="10" fill="#9CA3AF" font-family="Geist">avance ↑</text></svg>`;
document.body.insertAdjacentHTML('beforeend',`<div class="c${n.startsWith('var')?' hoy':''}"><div class="lbl">${n}</div><p>${t}</p>${g}</div>`);}
</script></body></html>
