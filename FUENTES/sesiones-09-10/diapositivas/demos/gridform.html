<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:640px;padding:34px 30px 24px}
.g{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#F3F4F6;border:1px dashed #9CA3AF;border-radius:8px;padding:0}
.f{background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:14px;font-size:14px;color:#0B0F19;font-weight:600;height:110px}
.f i{display:block;height:18px;border:1px solid #E5E7EB;border-radius:5px;margin-top:10px}
.a{grid-column:1 / -1;display:flex;gap:10px;padding:10px;border:2px solid #06B6C4;border-radius:10px;background:#fff}
.btn{padding:10px 18px;border-radius:7px;font-weight:600;font-size:14px}
.n{position:absolute;top:-26px;font-family:'Geist Mono';font-size:13px;color:#177E89;font-weight:600;transform:translateX(-50%)}
.v{position:absolute;top:-8px;bottom:-8px;border-left:2px dotted #177E89}
</style></head><body><div class="g">
<span class="n" style="left:0">1</span><span class="n" style="left:50%">2</span><span class="n" style="left:100%;transform:translateX(-100%);white-space:nowrap">3 (o -1)</span>
<span class="v" style="left:0"></span><span class="v" style="left:50%"></span><span class="v" style="left:100%"></span>
<div class="f">Tus datos<i></i><i></i></div><div class="f">Tu mensaje<i></i><i></i></div>
<div class="a"><span class="btn" style="background:#06B6C4;color:#fff">Enviar mensaje</span><span class="btn" style="border:1px solid #374151">Limpiar</span><span style="margin-left:auto;font-family:'Geist Mono';font-size:13px;color:#177E89;align-self:center">grid-column: 1 / -1</span></div>
</div></body></html>
