<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:628px;height:220px;overflow:hidden;font-family:Geist,sans-serif;background:#EEF9FA;display:flex;gap:18px;padding:16px 18px}
.form{width:210px;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:7px}
.form h2{font-family:Outfit;font-size:12px;color:#0B0F19;margin-bottom:2px}
label{font-size:8.5px;font-weight:600;color:#374151}
.in{height:20px;border:1px solid #E5E7EB;border-radius:5px;background:#F9FAFB}
.btn{margin-top:4px;height:24px;border-radius:6px;background:#06B6C4;color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center}
.cert{flex:1;background:#fff;border:1px solid #E5E7EB;border-radius:10px;padding:10px;display:flex}
.frame{flex:1;border:2px solid #06B6C4;border-radius:6px;outline:1px solid #0B0F19;outline-offset:-6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;position:relative}
.frame small{font-size:8px;letter-spacing:.2em;color:#374151;font-weight:600}
.frame h1{font-family:Outfit;font-weight:800;font-size:20px;letter-spacing:.12em;color:#0B0F19}
.ln{height:6px;border-radius:3px;background:#E5E7EB}
.name{height:10px;width:55%;border-radius:4px;background:#0B0F19;opacity:.85}
.seal{position:absolute;right:16px;bottom:12px;width:30px;height:30px;border-radius:50%;background:#06B6C4;box-shadow:0 0 0 3px #fff,0 0 0 4px #06B6C4}
.firma{position:absolute;left:18px;bottom:16px;width:70px;height:1px;background:#374151}
</style></head><body>
<div class="form"><h2>Nuevo certificado</h2><label>Participante</label><div class="in"></div><label>Curso</label><div class="in"></div><label>Fecha</label><div class="in"></div><div class="btn">Generar certificado</div></div>
<div class="cert"><div class="frame"><small>CENTRO DE INFORMÁTICA USS</small><h1>CERTIFICADO</h1><div class="name"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:50%"></div><div class="firma"></div><div class="seal"></div></div></div>
</body></html>
